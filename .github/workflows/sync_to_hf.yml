name: Sync to Hugging Face Space

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Upload to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi

          api = HfApi()
          jeton = os.environ["HF_TOKEN"]
          espace = "icimathieu/cartes_portfolio"

          api.upload_folder(
              folder_path=".",
              repo_id=espace,
              repo_type="space",
              token=jeton,
              ignore_patterns=[
                  ".git/*",
                  ".github/*",
                  ".claude/*",
                  ".gitignore",
                  ".gitattributes",
                  "deploy/*",
              ],
          )

          # Le Space a son propre .gitattributes : il doit déclarer les images
          # comme fichiers LFS, sinon le conteneur Docker reçoit un pointeur
          # texte à la place du JPEG et la galerie s'affiche vide. Le fichier de
          # GitHub, lui, reste sans ces lignes : sinon il faudrait git-lfs en
          # local pour committer la moindre image.
          api.upload_file(
              path_or_fileobj="deploy/gitattributes_space",
              path_in_repo=".gitattributes",
              repo_id=espace,
              repo_type="space",
              token=jeton,
              commit_message="Déclare les images en LFS côté Space",
          )
          print("Upload terminé.")
          EOF
